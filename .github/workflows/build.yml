name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libtool libtool-bin autoconf automake m4 pkg-config cmake libffi-dev libssl-dev
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK
        run: |
          buildozer android debug
          echo "Exit code: $?"
          ls -la bin/ || echo "No bin folder!"

      - name: Show full log
        if: always()
        run: |
          cat ~/.buildozer/logs/*.log 2>/dev/null || true
          find . -name "*.log" -exec tail -50 {} \; 2>/dev/null || true
          find . -name "*.apk" 2>/dev/null || echo "No APK found anywhere"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathshandbook-apk
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            .buildozer/android/platform/build*/*.log
          if-no-files-found: warn
