- name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        buildozer android debug 2>&1 | tee build_output.txt
        grep -E "ERROR|error:|Exception|failed|FAILED" build_output.txt | tail -30 || true

    - name: Show errors if failed
      if: failure()
      run: |
        grep -E "ERROR|error:|configure|autoconf|undefined" build_output.txt | tail -50 || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mathshandbook-apk
        path: bin/*.apk
        if-no-files-found: warn

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt
